name: Build mod JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Unpack the mod project
        run: unzip -q SpookyCraft-forge-1.20.1.zip -d project

      - name: Build
        working-directory: project/SpookyCraft
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spookycraft-jar
          path: project/SpookyCraft/build/libs/*.jar
          if-no-files-found: error
